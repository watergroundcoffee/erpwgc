<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10151b">
<title>goodang.id · Mobile</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  html, body { margin: 0; height: 100%; background: #10151b; color: #eef1f5; font: 600 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; }
  #muat { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }
  #muat i { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #2a323e; border-top-color: #14b8a6; animation: p 0.8s linear infinite; }
  #muat button { border: 0; border-radius: 10px; padding: 10px 18px; background: #14b8a6; color: #04221f; font: inherit; }
  @keyframes p { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="muat"><i></i><div id="muat-teks">Memuat goodang.id…</div></div>
<script>
/* goodang.id - tampilan MOBILE (v2026.10.120, DN-284).
   Alamat .../erpwgc/mobile selalu membuka tampilan mobile, di perangkat apa pun.
   File ini sengaja kecil: isi aplikasi diambil dari aplikasi utama (1 sumber kode -> tampilan selalu sama persis & ikut versi terbaru). */
(function () {
  var calon = ['./', './scan-resi-gudang.html', './index.html'];
  function gagal(pesan) {
    document.getElementById('muat').innerHTML = '<div>' + pesan + '</div><button type="button" onclick="location.reload()">Coba lagi</button>';
  }
  function coba(i) {
    if (i >= calon.length) { gagal('Aplikasi tidak ditemukan. Periksa internet lalu coba lagi.'); return; }
    fetch(calon[i], { cache: 'no-cache', credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.text() : ''; })
      .then(function (t) {
        if (!t || t.indexOf('omxAnalitik') < 0) { coba(i + 1); return; } // bukan halaman aplikasi (mis. halaman pengalih)
        document.open(); document.write(t); document.close();
      })
      .catch(function () { if (i + 1 < calon.length) coba(i + 1); else gagal('Tidak ada koneksi internet.'); });
  }
  coba(0);
})();
</script>
</body>
</html>
