<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniAI - Katalog Produk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; color: #1e293b; }
    /* Standar Hierarki Judul Global */
    .app-header-container { padding: 24px 32px 16px 32px; background: #ffffff; border-bottom: 1px solid #e2e8f0; margin-bottom: 24px; }
    .main-menu-title { font-size: 26px; font-weight: 800; color: #0f172a; letter-spacing: -0.5px; text-transform: uppercase; margin-bottom: 4px; }
    .header-divider { height: 1px; background-color: #cbd5e1; margin: 12px 0; width: 100%; }
    .submenu-title { font-size: 15px; font-weight: 600; color: #475569; display: flex; align-items: center; gap: 8px; }

    /* Animasi Loading Moving Dots */
    .moving-dots span {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin: 0 2px;
      background-color: #10b981;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .moving-dots span:nth-child(1) { animation-delay: -0.32s; }
    .moving-dots span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1.0); }
    }

    /* Cross-row hover highlight */
    tr.highlight-group { background-color: #ede9fe !important; transition: background-color 0.2s ease; }
    
    /* Popover Varian */
    #katalog-varian-popover {
      position: absolute;
      display: none;
      z-index: 9999;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      padding: 8px;
      width: 140px;
      text-align: center;
      pointer-events: none;
    }
    #katalog-varian-popover img { width: 120px; height: 120px; object-fit: cover; border-radius: 6px; margin-bottom: 4px; }
    #katalog-varian-popover .pop-sku { font-size: 11px; font-weight: 700; color: #334155; }
    #katalog-varian-popover .pop-name { font-size: 10px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">

  <!-- Header Global Konsisten -->
  <div class="app-header-container flex justify-between items-center">
    <div>
      <div id="global-menu-title" class="main-menu-title">Katalog</div>
      <div class="header-divider"></div>
      <div id="global-submenu-title" class="submenu-title">
        <i class="fa-solid fa-box text-amber-600"></i> <span>Produk Master</span>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <div class="bg-white px-4 py-2 rounded-full border border-slate-200 text-xs font-semibold shadow-sm text-slate-700">
        Waterground Coffee & Roastery • Owner
      </div>
    </div>
  </div>

  <div class="px-8 pb-12">
    <!-- Action Bar -->
    <div class="flex justify-between items-center mb-6">
      <div class="flex items-center gap-3">
        <button onclick="gantiTab('table')" id="btn-tab-table" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-medium shadow"><i class="fa-solid fa-bars mr-2"></i>Table</button>
        <button onclick="gantiTab('card')" id="btn-tab-card" class="bg-white text-slate-600 border border-slate-200 px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-50"><i class="fa-solid fa-grid-2 mr-2"></i>Card</button>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="bukaUploadMassal()" class="border border-slate-300 dark:border-slate-600 bg-transparent text-slate-700 dark:text-slate-200 px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-800 transition">
          <i class="fa-solid fa-file-arrow-up mr-2"></i>Upload Massal
        </button>
        <button onclick="bukaTambahProduk()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow transition">
          <i class="fa-solid fa-plus mr-2"></i>Tambah Produk Baru
        </button>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-wrap gap-4 items-center mb-6">
      <div class="relative flex-1 min-w-[240px]">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
        <input type="text" id="filter-search" oninput="muatKatalog()" placeholder="Cari Nama Produk / SKU..." class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
      </div>
      <select id="filter-kategori" onchange="muatKatalog()" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-600 focus:outline-none">
        <option value="">Semua Kategori</option>
        <option value="Coffee Beans">Coffee Beans</option>
        <option value="Equipment">Equipment</option>
      </select>
      <select id="filter-channel" onchange="muatKatalog()" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-600 focus:outline-none">
        <option value="">Semua Channel</option>
        <option value="Shopee">Shopee</option>
        <option value="Tokopedia">Tokopedia</option>
        <option value="TikTok Shop">TikTok Shop</option>
      </select>
      <select id="filter-sort" onchange="muatKatalog()" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-600 focus:outline-none">
        <option value="terbaru">Produk Terbaru</option>
        <option value="az">Nama A-Z</option>
        <option value="za">Nama Z-A</option>
      </select>
    </div>

    <!-- Konten Tabel Katalog -->
    <div id="katalog-container" class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="border-b border-slate-200 bg-slate-50/70 text-xs font-semibold text-slate-500 uppercase tracking-wider">
            <th class="p-4 w-10"><input type="checkbox"></th>
            <th class="p-4 w-20">Foto</th>
            <th class="p-4">Produk</th>
            <th class="p-4 w-48">Varian</th>
            <th class="p-4 w-36">Kategori</th>
            <th class="p-4 w-48">SKU Marketplace</th>
          </tr>
        </thead>
        <tbody id="tabel-produk-body" class="divide-y divide-slate-100 text-sm text-slate-700">
          <!-- Data dimuat dinamis -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Popover Varian Hover -->
  <div id="katalog-varian-popover">
    <img id="pop-img" src="" alt="Varian">
    <div id="pop-sku" class="pop-sku"></div>
    <div id="pop-name" class="pop-name"></div>
  </div>

  <script>
    // Mock Data Katalog Lengkap dengan Varian Saudara
    let dbProduk = [
      {
        id: "P001",
        nama: "OYCHA Mangkuk Teh Chawan Kaca Transparent Japanese Matcha Bowl Large Belly - D65 - Transparent",
        foto: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=150&q=80",
        kategori: "Equipment",
        skuGudang: "7CHAAXTP",
        skuSupplier: ["7CHAAXTP", "7RHT9LTP"],
        idVarianGroup: "G-OYCHA-D65",
        saudaraVarian: [
          { sku: "7CHAAXTP", nama: "Transparent", foto: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=150&q=80" },
          { sku: "7CHAAXAM", nama: "Amber Gold", foto: "https://images.unsplash.com/photo-1577937927133-66ef06acdf18?auto=format&fit=crop&w=150&q=80" },
          { sku: "7CHAAXBK", nama: "Matte Black", foto: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=150&q=80" }
        ],
        skuMarketplace: ["Shopee: 7CHAAXTP", "Tokopedia: 7CHAAXTP", "TikTok: 7CHAAXTP"],
        tanggal: "2026-09-24T08:00:00Z"
      },
      {
        id: "P002",
        nama: "One Two Cups Gelas Tumbler Kopi Korea Egg Shaped Stainless Steel 350ml - Silver",
        foto: "https://images.unsplash.com/photo-1517256064527-09c73fc73e38?auto=format&fit=crop&w=150&q=80",
        kategori: "Equipment",
        skuGudang: "7CHA0ASV",
        skuSupplier: ["7CHA0ASV"],
        idVarianGroup: "G-TUMBLER-350",
        saudaraVarian: [
          { sku: "7CHA0ASV", nama: "Silver 350ml", foto: "https://images.unsplash.com/photo-1517256064527-09c73fc73e38?auto=format&fit=crop&w=150&q=80" },
          { sku: "7CHA0ABK", nama: "Black 350ml", foto: "https://images.unsplash.com/photo-1544787219-7f47ccb76574?auto=format&fit=crop&w=150&q=80" }
        ],
        skuMarketplace: ["Shopee: 7CHA0ASV", "TikTok: 7CHA0ASV"],
        tanggal: "2026-09-23T10:00:00Z"
      }
    ];

    function muatKatalog() {
      const tbody = document.getElementById('tabel-produk-body');
      const sortVal = document.getElementById('filter-sort').value;
      const searchVal = document.getElementById('filter-search').value.toLowerCase();

      let dataFilter = dbProduk.filter(p => 
        p.nama.toLowerCase().includes(searchVal) || p.skuGudang.toLowerCase().includes(searchVal)
      );

      // Logika Sorting & Pengelompokan Varian Berdampingan secara Default
      if (sortVal === 'terbaru') {
        dataFilter.sort((a, b) => {
          if (a.idVarianGroup === b.idVarianGroup) return new Date(b.tanggal) - new Date(a.tanggal);
          return a.idVarianGroup.localeCompare(b.idVarianGroup);
        });
      } else if (sortVal === 'az') {
        dataFilter.sort((a, b) => a.nama.localeCompare(b.nama));
      } else if (sortVal === 'za') {
        dataFilter.sort((a, b) => b.nama.localeCompare(a.nama));
      }

      if (dataFilter.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-400">Tidak ada produk ditemukan.</td></tr>`;
        return;
      }

      let html = '';
      dataFilter.forEach(item => {
        // Render chips varian (termasuk varian diri sendiri dengan style khusus)
        let varianChips = '';
        if (item.saudaraVarian && item.saudaraVarian.length > 0) {
          item.saudaraVarian.forEach(v => {
            let isCurrent = (v.sku === item.skuGudang);
            let chipClass = isCurrent 
              ? "bg-slate-200 text-slate-800 border border-slate-300 cursor-default font-bold" 
              : "bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100 cursor-pointer";
            
            varianChips += `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs mr-1 mb-1 ${chipClass}" 
              ${!isCurrent ? `onclick="bukaDetailVarian('${v.sku}')" onmouseenter="tampilPopover(event, '${v.sku}', '${v.nama}', '${v.foto}')" onmouseleave="tutupPopover()"` : `title="Varian aktif saat ini (Baris ini)"`}>
              ${v.sku}
            </span>`;
          });
        } else {
          varianChips = `<span class="text-slate-400 text-xs">-</span>`;
        }

        let mpBadges = item.skuMarketplace.map(m => `<div class="text-xs text-slate-600 mb-0.5">${m}</div>`).join('');

        html += `<tr data-sku="${item.skuGudang}" data-group="${item.idVarianGroup}" class="hover:bg-slate-50 transition">
          <td class="p-4"><input type="checkbox"></td>
          <td class="p-4"><img src="${item.foto}" class="w-12 h-12 rounded-lg object-cover border border-slate-200 shadow-sm"></td>
          <td class="p-4">
            <div class="font-semibold text-slate-900">${item.nama}</div>
            <div class="text-xs text-slate-500 mt-1 flex gap-2">
              <span class="bg-slate-100 px-2 py-0.5 rounded border border-slate-200">SKU Gudang: <b>${item.skuGudang}</b></span>
            </div>
          </td>
          <td class="p-4 align-top">
            <div class="flex flex-wrap max-w-xs">${varianChips}</div>
          </td>
          <td class="p-4 text-slate-600 align-top">${item.kategori}</td>
          <td class="p-4 align-top">${mpBadges}</td>
        </tr>`;
      });

      tbody.innerHTML = html;
      pasangEventHighlightCrossRow();
    }

    // Interaksi Hover Highlight Cross-Row Varian
    function pasangEventHighlightCrossRow() {
      const chips = document.querySelectorAll('span[onmouseenter]');
      chips.forEach(chip => {
        chip.addEventListener('mouseenter', function(e) {
          // Cari sku target dari teks chip
          const skuTarget = this.textContent.trim();
          // Highlight semua baris yang memiliki sku tersebut atau segrup
          document.querySelectorAll('tr[data-sku]').forEach(tr => {
            if (tr.getAttribute('data-sku') === skuTarget) {
              tr.classList.add('highlight-group');
            }
          });
        });
        chip.addEventListener('mouseleave', function() {
          document.querySelectorAll('tr[data-sku]').forEach(tr => {
            tr.classList.remove('highlight-group');
          });
        });
      });
    }

    // Popover Handler
    function tampilPopover(e, sku, nama, foto) {
      const pop = document.getElementById('katalog-varian-popover');
      document.getElementById('pop-img').src = foto;
      document.getElementById('pop-sku').innerText = sku;
      document.getElementById('pop-name').innerText = nama;
      
      pop.style.display = 'block';
      pop.style.left = (e.pageX + 15) + 'px';
      pop.style.top = (e.pageY + 15) + 'px';
    }

    function tutupPopover() {
      document.getElementById('katalog-varian-popover').style.display = 'none';
    }

    function gantiTab(tab) {
      if (tab === 'table') {
        document.getElementById('btn-tab-table').className = "bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-medium shadow";
        document.getElementById('btn-tab-card').className = "bg-white text-slate-600 border border-slate-200 px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-50";
      } else {
        document.getElementById('btn-tab-card').className = "bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-medium shadow";
        document.getElementById('btn-tab-table').className = "bg-white text-slate-600 border border-slate-200 px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-50";
      }
    }

    function bukaUploadMassal() {
      alert("Membuka Modal Upload Massal dengan Form Table Besar & Smart Paste.");
    }

    function bukaTambahProduk() {
      alert("Membuka Form Tambah Produk Baru.");
    }

    function bukaDetailVarian(sku) {
      alert("Mengarahkan ke detail produk varian SKU: " + sku);
    }

    window.onload = function() {
      muatKatalog();
    };
  </script>
</body>
</html>
