<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>OmniAI</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OmniAI">
<style>
:root {
  --bg: #f3f5f7; --kartu: #ffffff; --garis: #e4e8ed; --garis-kuat: #cfd6de;
  --teks: #0f172a; --redup: #5b6676; --samar: #8a94a3;
  --merek: #0f766e; --merek-tua: #0b5d57; --merek-lembut: #e3f3ef;
  --sukses: #15803d; --sukses-lembut: #e7f5ec; --awas: #b45309; --awas-lembut: #fdf2e2;
  --bahaya: #c62828; --bahaya-lembut: #fdecec; --info: #1d4ed8; --info-lembut: #e8effd;
  --tab-h: 64px; --r: 16px; --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  --aman-atas: env(safe-area-inset-top, 0px); --aman-bawah: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--teks); font: 15px/1.45 var(--font); }
body { overscroll-behavior-y: contain; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
input, select, textarea { font-size: 16px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- kerangka ---------- */
#isi { padding: calc(var(--aman-atas) + 0px) 0 calc(var(--tab-h) + var(--aman-bawah) + 24px); min-height: 100vh; }
.layar { display: none; }
.layar.aktif { display: block; animation: muncul .16s ease-out; }
@keyframes muncul { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.atas { position: sticky; top: 0; z-index: 40; background: rgba(243,245,247,.94); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); padding: calc(var(--aman-atas) + 10px) 16px 8px; }
.atas-baris { display: flex; align-items: center; gap: 10px; }
.atas h1 { font-size: 22px; line-height: 1.15; margin: 0; flex: 1; letter-spacing: -.01em; }
.atas .sub { color: var(--redup); font-size: 13px; margin-top: 2px; }
.ikon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--garis); background: var(--kartu); display: grid; place-items: center; flex: none; }
.ikon-btn svg { width: 20px; height: 20px; }
.ikon-btn.putar svg { animation: putar 1s linear infinite; }
@keyframes putar { to { transform: rotate(360deg); } }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--merek); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; border: 0; }
.konten { padding: 4px 16px 0; }
.judul-bagian { display: flex; align-items: baseline; justify-content: space-between; margin: 18px 2px 8px; }
.judul-bagian h2 { font-size: 16px; margin: 0; }
.judul-bagian button { border: 0; background: none; color: var(--merek); font-weight: 600; font-size: 14px; padding: 4px; }

/* ---------- komponen ---------- */
.kartu { background: var(--kartu); border: 1px solid var(--garis); border-radius: var(--r); padding: 14px; }
.kartu + .kartu { margin-top: 10px; }
.kpi .kartu + .kartu, .grid-angka div + div { margin-top: 0; }
a.btn { color: var(--teks); text-decoration: none; }
a.btn.utama { color: #fff; }
.seg { display: flex; background: #e7ebef; border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 9px; padding: 8px 6px; font-weight: 600; font-size: 14px; color: var(--redup); }
.seg button.aktif { background: var(--kartu); color: var(--teks); box-shadow: 0 1px 3px rgba(15,23,42,.12); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 4px; margin: 0 -16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--garis-kuat); background: var(--kartu); border-radius: 999px; padding: 7px 13px; font-size: 13.5px; font-weight: 600; color: var(--redup); white-space: nowrap; }
.chip b { font-weight: 700; margin-left: 4px; color: var(--samar); }
.chip.aktif { background: var(--teks); border-color: var(--teks); color: #fff; }
.chip.aktif b { color: #cbd5e1; }
.cari { position: relative; margin: 6px 0 10px; }
.cari input { width: 100%; border: 1px solid var(--garis); background: var(--kartu); border-radius: 12px; padding: 11px 40px 11px 40px; outline: none; }
.cari input:focus { border-color: var(--merek); box-shadow: 0 0 0 3px var(--merek-lembut); }
.cari svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--samar); }
.cari .hapus { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; width: 32px; height: 32px; color: var(--samar); font-size: 18px; }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 9px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.proses { background: var(--awas-lembut); color: var(--awas); }
.pill.kirim { background: var(--info-lembut); color: var(--info); }
.pill.selesai { background: var(--sukses-lembut); color: var(--sukses); }
.pill.retur, .pill.batal { background: var(--bahaya-lembut); color: var(--bahaya); }
.pill.netral { background: #eef1f4; color: var(--redup); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--garis-kuat); background: var(--kartu); border-radius: 12px; padding: 12px 16px; font-weight: 700; font-size: 15px; min-height: 48px; }
.btn.utama { background: var(--merek); border-color: var(--merek); color: #fff; }
.btn.bahaya { color: var(--bahaya); border-color: #f1c4c4; }
.btn.penuh { width: 100%; }
.btn:disabled { opacity: .55; }
.btn svg { width: 20px; height: 20px; }
.kosong { text-align: center; color: var(--redup); padding: 36px 20px; }
.kosong .ik { font-size: 36px; margin-bottom: 6px; }
.kosong b { display: block; color: var(--teks); font-size: 16px; margin-bottom: 4px; }
.kosong .btn { margin-top: 14px; }
.skel { background: linear-gradient(90deg, #eceff2 25%, #f6f7f9 50%, #eceff2 75%); background-size: 200% 100%; animation: kilau 1.2s infinite; border-radius: 10px; }
@keyframes kilau { to { background-position: -200% 0; } }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .02em; }
.redup { color: var(--redup); }
.kecil { font-size: 12.5px; }

/* ---------- KPI & grafik ---------- */
.kpi { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi .kartu { padding: 13px; }
.kpi small { display: block; color: var(--redup); font-size: 12.5px; font-weight: 600; }
.kpi b { display: block; font-size: 21px; letter-spacing: -.01em; margin: 3px 0 2px; overflow-wrap: anywhere; }
.kpi .banding { font-size: 12px; font-weight: 700; }
.naik { color: var(--sukses); } .turun { color: var(--bahaya); }
.kpi .besar { grid-column: 1 / -1; background: var(--merek); border-color: var(--merek); color: #fff; }
.kpi .besar small { color: #c8ece6; }
.kpi .besar b { font-size: 30px; }
.kpi .besar .banding { color: #fff; opacity: .92; }
.grafik { position: relative; height: 170px; display: flex; align-items: flex-end; gap: 6px; padding: 26px 2px 0; }
.grafik .bt { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; border: 0; background: none; padding: 0; }
.grafik .bt i { display: block; width: 100%; max-width: 30px; border-radius: 7px 7px 3px 3px; background: #bfe3dc; min-height: 3px; transition: background .15s; }
.grafik .bt.pilih i, .grafik .bt.akhir i { background: var(--merek); }
.grafik .bt span { font-size: 11px; color: var(--samar); margin-top: 5px; font-weight: 600; }
.grafik .tip { position: absolute; top: 0; left: 0; right: 0; text-align: center; font-size: 13px; font-weight: 700; }
.kanal-baris { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--garis); }
.kanal-baris:first-child { border-top: 0; }
.kanal-baris .nm { flex: 1; min-width: 0; }
.kanal-baris .nm b { font-size: 14px; }
.kanal-baris .bar { height: 6px; border-radius: 6px; background: #eef1f4; margin-top: 5px; overflow: hidden; }
.kanal-baris .bar i { display: block; height: 100%; border-radius: 6px; }
.kanal-baris .nl { text-align: right; font-weight: 700; font-size: 14px; }
.kanal-baris .nl small { display: block; color: var(--redup); font-weight: 500; font-size: 12px; }
.titik { width: 10px; height: 10px; border-radius: 50%; flex: none; }

/* ---------- daftar / baris ---------- */
.daftar { background: var(--kartu); border: 1px solid var(--garis); border-radius: var(--r); overflow: hidden; }
.baris { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 14px; border: 0; border-top: 1px solid var(--garis); background: none; text-align: left; }
.baris:first-child { border-top: 0; }
.baris:active { background: #f6f8fa; }
.baris .ik { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font-size: 19px; flex: none; background: var(--merek-lembut); }
.baris .tx { flex: 1; min-width: 0; }
.baris .tx b { display: block; font-size: 15px; }
.baris .tx small { display: block; color: var(--redup); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.baris .kn { text-align: right; flex: none; }
.baris .kn b { font-size: 17px; }
.baris .panah { color: var(--samar); font-size: 20px; flex: none; }
.angka-bulat { min-width: 30px; height: 26px; padding: 0 8px; border-radius: 999px; display: inline-grid; place-items: center; font-weight: 800; font-size: 13px; background: var(--awas-lembut); color: var(--awas); }
.angka-bulat.utama { background: var(--bahaya-lembut); color: var(--bahaya); }
.angka-bulat.ringan { background: #eef1f4; color: var(--redup); }

/* ---------- kartu pesanan ---------- */
.pk { display: block; width: 100%; text-align: left; background: var(--kartu); border: 1px solid var(--garis); border-radius: var(--r); padding: 12px 14px; margin-bottom: 8px; }
.pk:active { background: #f8fafb; }
.pk-a { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--redup); }
.pk-a .kanal { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--teks); }
.pk-a .tgl { margin-left: auto; }
.pk-b { display: flex; align-items: baseline; gap: 10px; margin: 6px 0 6px; }
.pk-b b { flex: 1; min-width: 0; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pk-b .rp { font-weight: 800; font-size: 16px; white-space: nowrap; }
.pk-c { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--redup); }
.pk-c .mono { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pk-d { font-size: 12.5px; color: var(--samar); margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- tab bawah ---------- */
#tab { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; height: calc(var(--tab-h) + var(--aman-bawah)); padding-bottom: var(--aman-bawah); background: rgba(255,255,255,.97); border-top: 1px solid var(--garis); display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
#tab button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 700; color: var(--samar); position: relative; }
#tab button svg { width: 24px; height: 24px; }
#tab button.aktif { color: var(--merek); }
#tab .tab-scan .lingkar { width: 56px; height: 56px; margin-top: -26px; border-radius: 50%; background: var(--merek); color: #fff; display: grid; place-items: center; border: 4px solid #fff; box-shadow: 0 6px 16px rgba(15,118,110,.35); }
#tab .tab-scan .lingkar svg { width: 26px; height: 26px; }
#tab .lencana { position: absolute; top: 6px; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px; background: var(--bahaya); color: #fff; font-size: 10.5px; line-height: 17px; }

/* ---------- lembar bawah ---------- */
#lembar-latar { position: fixed; inset: 0; z-index: 90; background: rgba(15,23,42,.42); display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity .18s; }
#lembar-latar.buka { opacity: 1; pointer-events: auto; }
#lembar { width: 100%; max-height: 92vh; overflow: auto; background: var(--bg); border-radius: 22px 22px 0 0; padding: 6px 16px calc(var(--aman-bawah) + 18px); transform: translateY(40px); transition: transform .2s ease-out; }
#lembar-latar.buka #lembar { transform: none; }
.pegangan { width: 42px; height: 5px; border-radius: 5px; background: var(--garis-kuat); margin: 4px auto 10px; }
.lembar-kepala { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
.lembar-kepala h3 { margin: 0; font-size: 19px; flex: 1; line-height: 1.25; }
.lembar-kepala small { display: block; color: var(--redup); font-size: 13px; font-weight: 500; margin-top: 2px; }
.lembar-kepala .x { border: 0; background: #e7ebef; width: 34px; height: 34px; border-radius: 50%; font-size: 16px; flex: none; }
.info { background: var(--kartu); border: 1px solid var(--garis); border-radius: var(--r); padding: 2px 14px; }
.info-baris { display: flex; gap: 12px; padding: 11px 0; border-top: 1px solid var(--garis); align-items: flex-start; }
.info-baris:first-child { border-top: 0; }
.info-baris span { color: var(--redup); width: 92px; flex: none; font-size: 13.5px; }
.info-baris b { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.info-baris button { border: 0; background: var(--merek-lembut); color: var(--merek-tua); border-radius: 8px; padding: 3px 9px; font-size: 12.5px; font-weight: 700; flex: none; }
.aksi-tumpuk { display: grid; gap: 8px; margin-top: 14px; }
.aksi-dua { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.isian { margin-top: 12px; }
.isian label { display: block; font-weight: 700; font-size: 13.5px; margin-bottom: 6px; }
.isian input, .isian textarea, .isian select { width: 100%; border: 1px solid var(--garis-kuat); background: var(--kartu); border-radius: 12px; padding: 12px 13px; outline: none; }
.isian input:focus, .isian textarea:focus { border-color: var(--merek); box-shadow: 0 0 0 3px var(--merek-lembut); }
.isian .bantu { font-size: 12.5px; color: var(--redup); margin-top: 5px; }
.item-baris { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--garis); }
.item-baris:first-child { border-top: 0; }
.item-baris .q { font-weight: 800; min-width: 34px; color: var(--merek-tua); }
.item-baris .n { flex: 1; min-width: 0; }
.item-baris .n small { display: block; color: var(--samar); font-size: 12px; }

/* ---------- toast ---------- */
#toast { position: fixed; left: 16px; right: 16px; bottom: calc(var(--tab-h) + var(--aman-bawah) + 14px); z-index: 120; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.tst { background: #111827; color: #fff; border-radius: 14px; padding: 12px 14px; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); display: flex; align-items: center; gap: 10px; pointer-events: auto; animation: muncul .18s ease-out; }
.tst.gagal { background: #7f1d1d; }
.tst.ok { background: #065f46; }
.tst button { margin-left: auto; border: 0; background: rgba(255,255,255,.16); color: #fff; border-radius: 9px; padding: 6px 10px; font-weight: 700; font-size: 13px; }

/* ---------- scan ---------- */
#scan { position: fixed; inset: 0; z-index: 80; background: #0b0f14; color: #fff; display: flex; flex-direction: column; }
#scan[hidden] { display: none; }
.scan-atas { padding: calc(var(--aman-atas) + 10px) 14px 10px; display: flex; align-items: center; gap: 10px; }
.scan-atas .x { width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.12); color: #fff; font-size: 18px; flex: none; }
.scan-atas .seg { flex: 1; background: rgba(255,255,255,.1); }
.scan-atas .seg button { color: #cbd5e1; }
.scan-atas .seg button.aktif { background: #fff; color: #0b0f14; }
.scan-kamera { position: relative; flex: 0 0 auto; height: 44vh; min-height: 240px; background: #000; overflow: hidden; }
.scan-kamera video { width: 100%; height: 100%; object-fit: cover; display: block; }
.scan-bingkai { position: absolute; left: 10%; right: 10%; top: 26%; bottom: 26%; border-radius: 18px; box-shadow: 0 0 0 9999px rgba(0,0,0,.38); border: 2px solid rgba(255,255,255,.85); }
.scan-bingkai.kena { border-color: #34d399; box-shadow: 0 0 0 9999px rgba(16,185,129,.28); }
.scan-pesan { position: absolute; left: 12px; right: 12px; bottom: 12px; text-align: center; font-size: 13.5px; background: rgba(0,0,0,.55); border-radius: 10px; padding: 7px 10px; }
.scan-alat { position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 8px; }
.scan-alat button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(0,0,0,.5); color: #fff; font-size: 18px; }
.scan-alat button.on { background: #fde68a; color: #111; }
.scan-bawah { flex: 1; min-height: 0; background: var(--bg); color: var(--teks); border-radius: 20px 20px 0 0; margin-top: -16px; position: relative; display: flex; flex-direction: column; }
.scan-ringkas { display: flex; gap: 8px; padding: 14px 16px 8px; }
.scan-ringkas div { flex: 1; background: var(--kartu); border: 1px solid var(--garis); border-radius: 12px; padding: 8px 10px; }
.scan-ringkas small { display: block; color: var(--redup); font-size: 11.5px; font-weight: 600; }
.scan-ringkas b { font-size: 20px; }
.scan-ketik { display: flex; gap: 8px; padding: 0 16px 8px; }
.scan-ketik input { flex: 1; min-width: 0; border: 1px solid var(--garis-kuat); border-radius: 12px; padding: 11px 12px; background: var(--kartu); outline: none; }
.scan-ketik .btn { min-height: 46px; padding: 0 14px; }
.scan-daftar { flex: 1; overflow: auto; padding: 0 16px calc(var(--aman-bawah) + 14px); }
.sc { display: flex; align-items: center; gap: 10px; background: var(--kartu); border: 1px solid var(--garis); border-radius: 12px; padding: 10px 12px; margin-bottom: 6px; }
.sc .st { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; flex: none; font-size: 14px; }
.sc.antre .st { background: #eef1f4; color: var(--redup); }
.sc.kirim .st { background: var(--info-lembut); color: var(--info); }
.sc.ok .st { background: var(--sukses-lembut); color: var(--sukses); }
.sc.dobel .st { background: var(--awas-lembut); color: var(--awas); }
.sc.gagal .st { background: var(--bahaya-lembut); color: var(--bahaya); }
.sc .tx { flex: 1; min-width: 0; }
.sc .tx b { display: block; font-size: 14.5px; }
.sc .tx small { display: block; color: var(--redup); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sc .jam { color: var(--samar); font-size: 12px; flex: none; }
.sc button { border: 0; background: var(--bahaya-lembut); color: var(--bahaya); border-radius: 8px; padding: 5px 9px; font-weight: 700; font-size: 12px; }

/* ---------- login ---------- */
#login { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: calc(var(--aman-atas) + 30px) 24px calc(var(--aman-bawah) + 30px); background: linear-gradient(180deg, #e3f3ef 0%, var(--bg) 55%); }
#login .logo { width: 72px; height: 72px; border-radius: 20px; background: var(--merek); color: #fff; display: grid; place-items: center; font-size: 32px; font-weight: 900; margin-bottom: 18px; box-shadow: 0 10px 24px rgba(15,118,110,.3); }
#login h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -.02em; }
#login p { color: var(--redup); margin: 0 0 26px; }
#login .gsi { min-height: 46px; margin-bottom: 12px; }
#login .status { margin-top: 14px; font-size: 14px; color: var(--redup); min-height: 20px; }
#login .status.err { color: var(--bahaya); }
.stok-n { font-size: 20px; font-weight: 800; }
.stok-n.minus { color: var(--bahaya); } .stok-n.tipis { color: var(--awas); } .stok-n.aman { color: var(--sukses); }
.grid-angka { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.grid-angka div { background: var(--kartu); border: 1px solid var(--garis); border-radius: 12px; padding: 10px 12px; }

<script>
/* =====================================================================================

   Sesi login dibagi dengan sistem lama (localStorage "trg_user" di alamat yang sama).

const APP_VERSI = 'app-1.0 (v2026.10.28)';
const API = 'https://cjqkllvcagrokswcesyp.supabase.co/functions/v1/goodang';
const GOOGLE_CLIENT_ID = '50839351926-94bjqb78trho7eqetj8igvapqken15qi.apps.googleusercontent.com';
const LAMA = './';  // sistem lama (index.html / scan-resi-gudang.html)
const $ = id => document.getElementById(id);

const rp = n => 'Rp ' + Math.round(Number(n) || 0).toLocaleString('id-ID');
const rpPendek = n => { n = Number(n) || 0; const a = Math.abs(n); if (a >= 1e9) return 'Rp ' + (n / 1e9).toFixed(1).replace('.', ',') + ' M'; if (a >= 1e6) return 'Rp ' + (n / 1e6).toFixed(a >= 1e8 ? 0 : 1).replace('.', ',') + ' jt'; if (a >= 1e3) return 'Rp ' + Math.round(n / 1e3) + ' rb'; return rp(n); };
const angka = n => (Number(n) || 0).toLocaleString('id-ID');
const tglStr = d => { const p = x => String(x).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); };
const IKON = {
  beranda: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  pesanan: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  scan: '<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/>',
  stok: '<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/>',

const svg = (k, w) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w || 2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IKON[k]}</svg>`;
const KANAL_WARNA = { 'Shopee': '#ee4d2d', 'TikTok Shop': '#111827', 'Tokopedia': '#03ac0e', 'Conner': '#2563eb', 'Conner Hardware': '#2563eb', 'PO Sales': '#0f766e', 'Website': '#7c3aed', 'Offline': '#0f766e', 'Lainnya': '#94a3b8' };
const warnaKanal = k => KANAL_WARNA[k] || '#64748b';

/* ======================== sesi & API ======================== */
let user = null;
function muatUser() { try { user = JSON.parse(localStorage.getItem('trg_user') || 'null'); } catch (e) { user = null; } return user; }
const izin = () => (user && user.izin) || {};
const owner = () => !!(user && user.isOwner);
const boleh = k => owner() || !!izin()[k];
const bolehJual = () => boleh('buatInvoice');
let idSeq = 0;
function idPermintaan() { return 'app-' + Date.now().toString(36) + '-' + (++idSeq) + Math.random().toString(36).slice(2, 6); }
async function api(aksi, data, opsi) {
  opsi = opsi || {};
  const body = Object.assign({ aksi, email: user ? user.email : '', perangkat: 'hp' }, data || {});
  if (user && user.sessionToken && !body.sessionToken) body.sessionToken = user.sessionToken;
  if (opsi.tulis && !body.idPermintaan) body.idPermintaan = idPermintaan();
  const coba = opsi.tulis ? 1 : 2;
  let akhir = null;
  for (let i = 0; i < coba; i++) {
    const t0 = performance.now(), ctrl = new AbortController(), tm = setTimeout(() => ctrl.abort(), opsi.timeout || 45000);
    try {
      const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), signal: ctrl.signal });
      const teks = await r.text();
      let d; try { d = JSON.parse(teks); } catch (e) { throw new Error('Server sedang bermasalah (HTTP ' + r.status + '). Coba lagi.'); }
      analitikAksi(aksi, performance.now() - t0, d && d.success !== false, d && d.error, Number(r.headers.get('x-goodang-ms')) || null);
      if (d && d._sesiBaru && user) { user.sessionToken = d._sesiBaru; simpanUser(); }
      if (d && d.sesiHabis) { const lain = muatUserSimpan(); if (lain && lain.sessionToken && user && lain.sessionToken !== user.sessionToken) { user.sessionToken = lain.sessionToken; continue; } keluar('Sesi login berakhir. Silakan masuk lagi.'); throw new Error('Sesi berakhir'); }
      return d;
    } catch (e) {
      akhir = e.name === 'AbortError' ? new Error('Server tidak menjawab - cek internet lalu coba lagi.') : (/Failed to fetch|Load failed|NetworkError/i.test(e.message) ? new Error('Tidak ada koneksi internet.') : e);
      analitikAksi(aksi, performance.now() - t0, false, akhir.message, null);
      if (i + 1 < coba && !/Sesi berakhir/.test(akhir.message)) await new Promise(r => setTimeout(r, 1500));
    } finally { clearTimeout(tm); }
  }
  throw akhir;
}
function muatUserSimpan() { try { return JSON.parse(localStorage.getItem('trg_user') || 'null'); } catch (e) { return null; } }
function simpanUser() { try { localStorage.setItem('trg_user', JSON.stringify(user)); } catch (e) { } }
// cache baca cepat (tampil instan, lalu disegarkan)
function cacheAmbil(k, umurMaks) { try { const c = JSON.parse(localStorage.getItem('app_c_' + k) || 'null'); if (c && (!umurMaks || Date.now() - c.t < umurMaks) && c.u === (user && user.email)) return c; } catch (e) { } return null; }
function cacheSimpan(k, d) { try { localStorage.setItem('app_c_' + k, JSON.stringify({ t: Date.now(), u: user && user.email, d })); } catch (e) { try { localStorage.removeItem('app_c_' + k); } catch (e2) { } } }
function umurTeks(t) { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'baru saja' : m < 60 ? m + ' mnt lalu' : Math.round(m / 60) + ' jam lalu'; }

/* ======================== statistik pemakaian (masuk ke Statistik Pengguna) ======================== */
const AN = { sesi: 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), antre: [], lokasi: 'app:beranda', mulai: Date.now() };
function anPush(e) { AN.antre.push(Object.assign({ id: AN.sesi + '-' + Date.now().toString(36) + '-' + AN.antre.length + Math.random().toString(36).slice(2, 5), t: Date.now(), s: AN.sesi, l: AN.lokasi, u: user && user.email }, e)); if (AN.antre.length > 200) AN.antre.splice(0, AN.antre.length - 200); }
function analitikAksi(aksi, ms, ok, pesan, sv) { if (aksi === 'analitik_kirim') return; anPush({ j: 'aksi', n: aksi, d: Math.round(ms), ok: !!ok, p: ok ? '' : String(pesan || '').slice(0, 200), sv: sv }); }
function analitikMuat(lokasi) { AN.lokasi = lokasi; anPush({ j: 'muat', n: lokasi, d: 0, ok: true }); }
async function analitikKirim() {
  if (!AN.antre.length || !user) return;
  const kirim = AN.antre.splice(0, 100);
  const sesi = { id: AN.sesi, email: user.email, nama: user.nama, role: user.role, tampilan: 'app', jenis_perangkat: 'HP', layar: innerWidth + 'x' + innerHeight, browser: (navigator.userAgent.match(/(Chrome|Safari|Firefox)\/[\d.]+/) || [''])[0], versi: APP_VERSI, mulai: AN.mulai, aktif: true };
  try { await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ aksi: 'analitik_kirim', sessionToken: user.sessionToken, sesi: [sesi], peristiwa: kirim }), keepalive: true }); }
  catch (e) { AN.antre.unshift(...kirim); }
}
setInterval(analitikKirim, 20000);
document.addEventListener('visibilitychange', () => { if (document.hidden) analitikKirim(); });

/* ======================== UI umum ======================== */
function toast(teks, jenis, aksi) {
  const t = document.createElement('div'); t.className = 'tst ' + (jenis || '');
  t.innerHTML = `<span>${esc(teks)}</span>` + (aksi ? `<button type="button">${esc(aksi.label)}</button>` : '');
  if (aksi) t.querySelector('button').onclick = () => { t.remove(); aksi.fn(); };
  $('toast').appendChild(t);
  setTimeout(() => t.remove(), aksi ? 6000 : 3200);
}
function lembarBuka(judul, sub, isi) {
  $('lembar').innerHTML = `<div class="pegangan" aria-hidden="true"></div><div class="lembar-kepala"><h3>${esc(judul)}${sub ? `<small>${esc(sub)}</small>` : ''}</h3><button type="button" class="x" onclick="lembarTutup()" aria-label="Tutup">✕</button></div><div id="lembar-isi">${isi}</div>`;
  $('lembar-latar').classList.add('buka'); $('lembar').scrollTop = 0;
}
function lembarIsi(html) { const x = $('lembar-isi'); if (x) x.innerHTML = html; }
function lembarTutup() { $('lembar-latar').classList.remove('buka'); }
let geser0 = null;
$('lembar').addEventListener('touchstart', e => { geser0 = $('lembar').scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
$('lembar').addEventListener('touchend', e => { if (geser0 !== null && e.changedTouches[0].clientY - geser0 > 110) lembarTutup(); geser0 = null; }, { passive: true });
function konfirmasi(judul, html, ya, bahaya) {
  return new Promise(res => {
    lembarBuka(judul, '', `<div class="kartu" style="font-size:15px;">${html}</div><div class="aksi-dua"><button class="btn" type="button" id="kf-tidak">Batal</button><button class="btn ${bahaya ? 'bahaya' : 'utama'}" type="button" id="kf-ya">${esc(ya || 'Ya')}</button></div>`);
    $('kf-tidak').onclick = () => { lembarTutup(); res(false); };
    $('kf-ya').onclick = () => { lembarTutup(); res(true); };
  });
}
async function salin(teks) { try { await navigator.clipboard.writeText(teks); toast('Disalin: ' + teks, 'ok'); } catch (e) { toast('Gagal menyalin'); } }
let bunyiKtx = null;
function bunyi(ok) {
  try {
    bunyiKtx = bunyiKtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = bunyiKtx.createOscillator(), g = bunyiKtx.createGain();
    o.frequency.value = ok ? 1250 : 260; o.type = ok ? 'sine' : 'square'; g.gain.value = .08;
    o.connect(g); g.connect(bunyiKtx.destination); o.start(); o.stop(bunyiKtx.currentTime + (ok ? .09 : .3));
  } catch (e) { }
  try { navigator.vibrate && navigator.vibrate(ok ? 40 : [80, 60, 80]); } catch (e) { }
}
function fileKeDataUrl(f, maks) {
  return new Promise((res, rej) => {
    if (/pdf/i.test(f.type)) { const fr = new FileReader(); fr.onload = () => res({ data: fr.result, mime: 'application/pdf' }); fr.onerror = rej; fr.readAsDataURL(f); return; }
    const img = new Image(), u = URL.createObjectURL(f);
    img.onload = () => { const k = Math.min(1, (maks || 1400) / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res({ data: c.toDataURL('image/jpeg', .8), mime: 'image/jpeg' }); };
    img.onerror = () => rej(new Error('File tidak bisa dibaca'));
    img.src = u;
  });
}
window.addEventListener('online', () => { const b = document.querySelector('.lencana-offline'); if (b) b.remove(); scanKirimAntrean(); });
window.addEventListener('offline', () => { if (!document.querySelector('.lencana-offline')) { const b = document.createElement('div'); b.className = 'lencana-offline'; b.textContent = 'Offline · data tersimpan & dikirim saat online'; document.body.appendChild(b); } });

/* ======================== navigasi ======================== */
const TAB = [
  { k: 'beranda', label: 'Beranda', ok: () => true },
  { k: 'pesanan', label: 'Pesanan', ok: () => boleh('buatInvoice') || boleh('printLabel') },
  { k: 'scan', label: 'Scan', ok: () => boleh('scanResiKeluar') || boleh('scanResiMasuk') },
  { k: 'stok', label: 'Stok', ok: () => boleh('mintaStock') },
  { k: 'akun', label: 'Lainnya', ok: () => true }
];
let tabAktif = 'beranda';
function susunTab() {
  $('tab').innerHTML = TAB.filter(t => t.ok()).map(t => t.k === 'scan'
    ? `<button type="button" class="tab-scan" data-tab="scan" onclick="scanBuka()" aria-label="Scan"><span class="lingkar">${svg('scan', 2.3)}</span>Scan</button>`
    : `<button type="button" data-tab="${t.k}" onclick="ke('${t.k}')">${svg(t.k)}${t.label}<span class="lencana" id="lencana-${t.k}" hidden></span></button>`).join('');
}
function ke(tab, opsi) {
  if (tab === 'scan') return scanBuka();
  tabAktif = tab;
  document.querySelectorAll('.layar').forEach(l => l.classList.toggle('aktif', l.id === 'l-' + tab));
  document.querySelectorAll('#tab [data-tab]').forEach(b => b.classList.toggle('aktif', b.dataset.tab === tab));
  window.scrollTo(0, 0);
  analitikMuat('app:' + tab);
  try { history.replaceState(null, '', '#' + tab); } catch (e) { }
  ({ beranda: berandaTampil, pesanan: pesananTampil, stok: stokTampil, akun: akunTampil })[tab](opsi || {});
}
function sapa() { const j = new Date().getHours(); return j < 11 ? 'Selamat pagi' : j < 15 ? 'Selamat siang' : j < 18 ? 'Selamat sore' : 'Selamat malam'; }
function inisial() { return String((user && user.nama) || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(x => x[0].toUpperCase()).join(''); }
function kepala(judul, sub, kanan) {
  return `<header class="atas"><div class="atas-baris"><div style="flex:1;min-width:0;"><h1>${judul}</h1>${sub ? `<div class="sub">${sub}</div>` : ''}</div>${kanan || ''}</div></header>`;
}

/* ======================== LOGIN ======================== */
function loginTampil(pesan, err) {
  $('isi').hidden = true; $('tab').hidden = true; $('login').hidden = false;
  const st = $('login-status'); st.textContent = pesan || ''; st.className = 'status' + (err ? ' err' : '');
  muatGsi();
}
function muatGsi() {
  if (window.google && google.accounts) return pasangGsi();
  if (document.getElementById('gsi-skrip')) return;
  const s = document.createElement('script'); s.id = 'gsi-skrip'; s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.onload = pasangGsi;
  s.onerror = () => { $('login-status').textContent = 'Tombol Google gagal dimuat - cek internet lalu muat ulang.'; };
  document.head.appendChild(s);
}
function pasangGsi() {
  try {
    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: r => loginGoogle(r.credential) });
    google.accounts.id.renderButton($('gsi'), { theme: 'outline', size: 'large', shape: 'pill', width: Math.min(360, innerWidth - 48), text: 'signin_with' });
  } catch (e) { }
}
async function loginGoogle(token) {
  if (!token) return;
  $('login-status').textContent = 'Memverifikasi akun…'; $('login-status').className = 'status';
  try { const d = await api('login', { idToken: token, segar: true }, { timeout: 45000 }); loginSelesai(d); }
  catch (e) { $('login-status').textContent = e.message; $('login-status').className = 'status err'; }
}
async function loginGudang(pin) {
  $('login-status').textContent = 'Memverifikasi…'; $('login-status').className = 'status';
  try {
    const d = await api('login_admin_gudang', { pin: pin || undefined, segar: true }, { timeout: 30000 });
    if (d && d.perluPin) {
      $('login-status').textContent = pin ? (d.error || 'PIN salah.') : ''; $('login-status').className = 'status' + (pin ? ' err' : '');
      lembarBuka('Masuk Admin Gudang', 'Masukkan PIN dari Owner', `<form onsubmit="event.preventDefault(); const p = document.getElementById('pin-gd').value; lembarTutup(); loginGudang(p);"><div class="isian"><label for="pin-gd">PIN</label><input id="pin-gd" type="password" inputmode="numeric" autocomplete="current-password"></div><div class="aksi-tumpuk"><button class="btn utama penuh" type="submit">Masuk</button></div></form>`);
      setTimeout(() => { const i = $('pin-gd'); if (i) i.focus(); }, 200);
      return;
    }
    loginSelesai(d);
  } catch (e) { $('login-status').textContent = e.message; $('login-status').className = 'status err'; }
}
function loginSelesai(d) {
  if (!d || !d.success) { $('login-status').textContent = String((d && d.error) || 'Login gagal').replace(/^Error:\s*/, ''); $('login-status').className = 'status err'; bunyi(false); return; }
  user = d; simpanUser();

  mulaiAplikasi();
}
function keluar(pesan) {
  try { localStorage.removeItem('trg_user'); } catch (e) { }
  user = null; scanTutup(true); lembarTutup();
  loginTampil(pesan || '');
}
async function cekStatusLatar() {
  try {
    const d = await api('cek_status_staff', { segar: true }, { timeout: 20000 });
    if (d && d.success && d.aktif === false && user) { keluar('Akun belum aktif / dinonaktifkan. Hubungi Owner.'); return; }
    if (d && d.success && user) {

/* ======================== BERANDA ======================== */
const BR = { seg: null, periode: 'hari', rekap: null, ac: null, resi: null, resiTgl: 'hari', resiFilter: 'semua', jalan: {} };
function berandaTampil() {
  if (!BR.seg) BR.seg = bolehJual() ? 'jual' : 'gudang';
  if (!bolehJual()) BR.seg = 'gudang';
  berandaRender();
  if (BR.seg === 'jual') { if (!BR.rekap || Date.now() - BR.rekap.t > 120000) muatRekap(); }
  else if (!BR.resi || Date.now() - BR.resi.t > 60000) muatResiHarian();
  if (!BR.ac || Date.now() - BR.ac.t > 300000) muatAc();
}
function berandaRender() {

const ST = { data: null, t: 0, filter: 'semua', q: '', tampil: 60, jalan: false, err: null };

  if (boleh('buatInvoice')) layarLama.push(['💸', 'Input biaya operasional', 'Catat pengeluaran + foto nota', lamaUrl('biaya')]);
  if (boleh('scanResiKeluar')) layarLama.push(['🖨️', 'Tanda terima kurir', 'Cetak daftar resi untuk kurir', lamaUrl('scan-keluar')]);
  const grup = FITUR.filter(g => fiturBoleh(g.izin)).map(g => `<div class="judul-bagian"><h2>${esc(g.judul)}</h2></div><div class="daftar">${g.item.map(([ik, l, h]) => `<a class="baris" style="text-decoration:none;color:inherit;" href="${lengkapUrl(h)}"><span class="ik">${ik}</span><span class="tx"><b>${esc(l)}</b></span><span class="panah">›</span></a>`).join('')}</div>`).join('');
  const pasang = bisaPasang();
  $('l-akun').innerHTML = kepala('Lainnya', '') + `<div class="konten">
    <div class="kartu" style="display:flex;align-items:center;gap:12px;"><span class="avatar" style="width:48px;height:48px;font-size:16px;">${esc(inisial())}</span><div style="flex:1;min-width:0;"><b style="font-size:16px;">${esc(user.nama || '')}</b><div class="kecil redup" style="overflow:hidden;text-overflow:ellipsis;">${esc(user.email || '')} · ${esc(user.role || '-')}</div></div></div>
    ${pasang ? `<div class="daftar" style="margin-top:10px;"><button type="button" class="baris" onclick="pasangApp()"><span class="ik">📲</span><span class="tx"><b>Pasang di layar HP</b><small>${esc(pasang)}</small></span><span class="panah">›</span></button></div>` : ''}
    ${owner() ? `<div class="daftar" style="margin-top:10px;"><button type="button" class="baris" onclick="catatanForm()"><span class="ik">💡</span><span class="tx"><b>Kirim catatan ke developer</b><small>Bug, ide, atau permintaan untuk aplikasi ini</small></span><span class="panah">›</span></button></div>` : ''}
    ${layarLama.length ? `<div class="judul-bagian"><h2>Layar kerja gudang</h2></div><div class="daftar">${layarLama.map(([ik, l, s, u]) => `<a class="baris" style="text-decoration:none;color:inherit;" href="${u}"><span class="ik">${ik}</span><span class="tx"><b>${esc(l)}</b><small>${esc(s)}</small></span><span class="panah">›</span></a>`).join('')}</div>` : ''}
    ${grup ? `<div class="kecil redup" style="margin:18px 2px -6px;">Modul di bawah masih memakai tampilan lengkap (versi ringkas) - satu per satu akan didesain ulang di aplikasi ini.</div>${grup}` : ''}
    <div class="daftar" style="margin-top:18px;"><button type="button" class="baris" onclick="keluarKonfirmasi()"><span class="ik" style="background:var(--bahaya-lembut);">🚪</span><span class="tx"><b style="color:var(--bahaya);">Keluar</b></span></button></div>
    <div class="kecil redup" style="text-align:center;margin:16px 0;">OmniAI ${esc(APP_VERSI)}</div></div>`;
}
async function keluarKonfirmasi() { if (await konfirmasi('Keluar dari OmniAI?', 'Kamu perlu masuk lagi untuk memakai aplikasi. Resi yang belum terkirim tetap tersimpan di HP ini.', 'Keluar', true)) keluar(); }
function catatanForm() {
  lembarBuka('Catatan ke developer', 'Masuk ke Catatan Developer', `<form onsubmit="event.preventDefault(); catatanKirim();">
    <div class="isian"><label for="cn-jenis">Jenis</label><select id="cn-jenis"><option>Bug</option><option>Ide Fitur</option><option>Tampilan</option><option>Lainnya</option></select></div>
    <div class="isian"><label for="cn-hal">Halaman</label><select id="cn-hal"><option value="beranda">Beranda</option><option value="pesanan">Pesanan</option><option value="scan">Scan</option><option value="stok">Stok</option><option value="akun">Lainnya</option></select></div>
    <div class="isian"><label for="cn-teks">Catatan</label><textarea id="cn-teks" rows="5" required placeholder="Ceritakan apa yang terjadi atau yang kamu mau"></textarea></div>
    <div class="aksi-tumpuk"><button class="btn utama penuh" type="submit" id="cn-btn">Kirim catatan</button></div></form>`);
}
async function catatanKirim() {
  const teks = String(($('cn-teks') || {}).value || '').trim(); if (!teks) return;
  const b = $('cn-btn'); if (b) { b.disabled = true; b.textContent = 'Mengirim…'; }
  try {
    const d = await api('dev_catatan_simpan', { catatan: teks, jenis: $('cn-jenis').value, prioritas: 'Sedang', alamat: 'app:' + $('cn-hal').value, judulHalaman: 'OmniAI App · ' + $('cn-hal').value, hash: location.hash, versi: APP_VERSI, perangkat: innerWidth + 'x' + innerHeight + ' · HP · app', bagian: '', error: [] }, { tulis: true });
    if (!d || !d.success) throw new Error((d && d.error) || 'Gagal');
    lembarTutup(); toast('Catatan terkirim', 'ok');
  } catch (e) { toast(e.message, 'gagal'); if (b) { b.disabled = false; b.textContent = 'Kirim catatan'; } }
}
let pasangPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); pasangPrompt = e; if (tabAktif === 'akun' && user) akunTampil(); });
function standalone() { return (matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
function bisaPasang() { if (standalone()) return ''; if (pasangPrompt) return 'Ikon OmniAI di layar HP, terbuka layar penuh'; if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) return 'Safari: Bagikan → Tambahkan ke Layar Utama'; return 'Menu browser ⋮ → Instal aplikasi'; }
async function pasangApp() {
  if (pasangPrompt) { pasangPrompt.prompt(); try { await pasangPrompt.userChoice; } catch (e) { } pasangPrompt = null; akunTampil(); return; }
  lembarBuka('Pasang OmniAI di HP', '', `<div class="kartu" style="font-size:15px;">${/iPhone|iPad|iPod/i.test(navigator.userAgent) ? '1. Ketuk tombol <b>Bagikan</b> (kotak dengan panah ke atas) di bawah layar Safari.<br>2. Pilih <b>Tambahkan ke Layar Utama</b>.<br>3. Ketuk <b>Tambah</b>.' : '1. Ketuk <b>⋮</b> di kanan atas Chrome.<br>2. Pilih <b>Instal aplikasi</b> atau <b>Tambahkan ke layar utama</b>.<br>3. Ketuk <b>Instal</b>.'}</div><div class="aksi-tumpuk"><button class="btn utama penuh" type="button" onclick="lembarTutup()">Mengerti</button></div>`);
}
if ('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));

/* ======================== mulai ======================== */
function mulaiAplikasi() {
  $('login').hidden = true; $('isi').hidden = false; $('tab').hidden = false;
  susunTab();
  const awal = (location.hash || '').replace('#', '');
  const t = TAB.find(x => x.k === awal && x.ok() && x.k !== 'scan');
  ke(t ? t.k : 'beranda');
  cekStatusLatar();
  if (SC.antre.some(x => x.status === 'antre' || x.status === 'kirim')) { SC.antre.forEach(x => { if (x.status === 'kirim') x.status = 'antre'; }); scanKirimAntrean(); }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && user && $('scan').hidden) { const f = { beranda: berandaTampil, pesanan: pesananTampil, stok: stokTampil }[tabAktif]; if (f) f({}); } });
window.addEventListener('storage', e => { if (e.key === 'trg_user') { const u = muatUserSimpan(); if (!u) keluar(); else if (user) { user.sessionToken = u.sessionToken; } } });
if (muatUser() && user.sessionToken !== undefined && user.email) mulaiAplikasi(); else loginTampil();
</script>
</body>
</html>
