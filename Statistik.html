<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statistik Pengguna - OmniAI</title>
<meta name="author" content="HERMAWAN" />
<link rel="icon" type="image/png" href="https://i.ibb.co.com/cd2KqYx/Waterground3.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<script>
/* Tema sama dengan OmniAI: tampilan HP = gelap, laptop/PC = terang (ikut pilihan "omni_tampilan" di perangkat ini) */
(function () {
  var m = false;
  try {
    var p = localStorage.getItem('omni_tampilan');
    if (p === 'mobile') m = true; else if (p === 'web') m = false;
    else m = /iPhone|iPod|Android.+Mobile|Mobi/i.test(navigator.userAgent || '');
  } catch (e) { }
  document.documentElement.classList.add(m ? 'gelap' : 'terang');
  document.documentElement.style.colorScheme = m ? 'dark' : 'light';
})();
</script>
<style>
  :root {
    --bg: #f8fafc; --panel: #ffffff; --border: #e2e8f0; --teks: #1e293b; --redup: #64748b; --lembut: #f1f5f9;
    --aksen: #4f46e5; --aksen-lembut: rgba(79,70,229,0.09); --aksen-teks: #4338ca;
    --hijau: #059669; --merah: #dc2626; --kuning: #d97706; --biru: #2563eb;
    --bayang: 0 1px 2px rgba(15,23,42,0.04), 0 8px 24px -12px rgba(15,23,42,0.12);
  }
  html.gelap {
    --bg: #10151b; --panel: #1a2029; --border: #2a323e; --teks: #eef1f5; --redup: #a3adbb; --lembut: #222a35;
    --aksen: #14b8a6; --aksen-lembut: rgba(20,184,166,0.14); --aksen-teks: #5eead4;
    --hijau: #34d399; --merah: #f87171; --kuning: #fbbf24; --biru: #60a5fa;
    --bayang: 0 1px 2px rgba(0,0,0,0.3);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--teks); font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 14px; line-height: 1.45; }
  h1, h2, h3 { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; margin: 0; }
  button, input, select { font: inherit; color: inherit; }
  .topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; padding: 12px 22px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--aksen); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 14px; }
  .topbar .judul small { display: block; color: var(--redup); font-size: 11.5px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; }
  .topbar .judul b { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 17px; }
  .topbar .kanan { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--redup); font-size: 13px; }
  .tombol { border: 1px solid var(--border); background: var(--panel); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--teks); }
  .tombol:hover { border-color: var(--aksen); color: var(--aksen-teks); }
  .tombol.utama { background: var(--aksen); color: #fff; border-color: var(--aksen); }
  .tombol.utama:hover { filter: brightness(1.08); color: #fff; }
  .tombol[disabled] { opacity: .55; cursor: progress; }
  main { max-width: 1320px; margin: 0 auto; padding: 20px 22px 60px; }
  .filter { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 16px; }
  .chip { border: 1px solid var(--border); background: var(--panel); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-weight: 600; font-size: 13px; }
  .chip.aktif { background: var(--aksen-lembut); border-color: var(--aksen); color: var(--aksen-teks); }
  .filter input[type=date] { border: 1px solid var(--border); background: var(--panel); border-radius: 10px; padding: 6px 10px; }
  .filter .status { color: var(--redup); font-size: 12.5px; margin-left: auto; }
  .kartu { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--bayang); padding: 16px 18px; min-width: 0; }
  .kartu h3 { font-size: 14.5px; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .kartu h3 small { font-family: 'Inter', sans-serif; font-weight: 500; color: var(--redup); font-size: 12px; margin-left: auto; }
  .kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .kpi .kartu { padding: 14px 16px; }
  .kpi .label { color: var(--redup); font-size: 12px; font-weight: 600; }
  .kpi .angka { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 26px; font-weight: 800; margin-top: 4px; letter-spacing: -.01em; }
  .kpi .ket { color: var(--redup); font-size: 12px; margin-top: 2px; }
  .sorotan { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .sorot { border-radius: 14px; padding: 12px 14px; border: 1px solid var(--border); background: var(--panel); display: flex; gap: 10px; align-items: flex-start; }
  .sorot .ikon { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-size: 15px; flex: none; background: var(--aksen-lembut); }
  .sorot.bahaya .ikon { background: rgba(220,38,38,.12); } .sorot.waspada .ikon { background: rgba(217,119,6,.14); } .sorot.baik .ikon { background: rgba(5,150,105,.12); }
  .sorot b { display: block; font-size: 13px; margin-bottom: 2px; }
  .sorot span { color: var(--redup); font-size: 12.5px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 14px; margin-bottom: 14px; }
  @media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } main { padding: 14px 12px 50px; } .topbar { padding: 10px 12px; } .topbar .kanan .nama { display: none; } }
  .gulir { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--redup); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  td.n, th.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  td .sub { display: block; color: var(--redup); font-size: 11.5px; word-break: break-all; }
  .kosong { color: var(--redup); font-size: 13px; padding: 14px 4px; text-align: center; }
  .bar { height: 6px; border-radius: 99px; background: var(--lembut); overflow: hidden; display: flex; min-width: 70px; margin-top: 4px; }
  .bar i { display: block; height: 100%; } .bar i.sv { background: var(--aksen); } .bar i.jr { background: var(--kuning); }
  .lambat { color: var(--merah); font-weight: 700; } .sedang { color: var(--kuning); font-weight: 700; } .cepat { color: var(--hijau); font-weight: 700; }
  .grafik svg { width: 100%; height: 190px; display: block; }
  .jam { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; }
  .jam div { border-radius: 6px; height: 34px; background: var(--aksen); position: relative; }
  .jam-label { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; color: var(--redup); font-size: 10.5px; text-align: center; margin-top: 4px; }
  .legenda { display: flex; gap: 14px; color: var(--redup); font-size: 12px; margin-top: 8px; flex-wrap: wrap; }
  .legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .unduh { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .meter { height: 8px; border-radius: 99px; background: var(--lembut); overflow: hidden; margin: 6px 0 4px; }
  .meter i { display: block; height: 100%; background: var(--aksen); }
  .layar-pesan { max-width: 520px; margin: 12vh auto; text-align: center; }
  .layar-pesan .kartu { padding: 28px; }
  .layar-pesan p { color: var(--redup); }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: var(--lembut); color: var(--redup); margin-right: 4px; }
  .skeleton { background: linear-gradient(90deg, var(--lembut), var(--border), var(--lembut)); background-size: 200% 100%; animation: kilau 1.2s infinite; border-radius: 8px; height: 14px; margin: 8px 0; }
  @keyframes kilau { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">Omi</div>
  <div class="judul"><small>OmniAI ERP · Khusus Owner</small><b>Statistik Pengguna</b></div>
  <div class="kanan"><span class="nama" id="nama-owner"></span><a class="tombol" href="./">← Kembali ke OmniAI</a></div>
</header>
<main id="isi">
  <div class="kartu"><div class="skeleton" style="width:40%"></div><div class="skeleton"></div><div class="skeleton" style="width:70%"></div></div>
</main>

<script>
(function () {
  'use strict';
  var URL = 'https://cjqkllvcagrokswcesyp.supabase.co/functions/v1/goodang';
  var BATAS_DB_MB = 500;
  var S = { dari: '', sampai: '', preset: '7', data: null, token: '', owner: null, sibuk: false };

  function el(id) { return document.getElementById(id); }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function angka(v) { var n = Number(v) || 0; return n.toLocaleString('id-ID'); }
  function ms(v) {
    if (v === null || v === undefined || v === '') return '-';
    var n = Number(v);
    if (n < 1000) return Math.round(n) + ' ms';
    if (n < 60000) return (n / 1000).toLocaleString('id-ID', { maximumFractionDigits: n < 10000 ? 2 : 1 }) + ' dtk';
    return (n / 60000).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' mnt';
  }
  function kelasCepat(v, a, b) { var n = Number(v) || 0; return n >= (b || 3000) ? 'lambat' : (n >= (a || 1000) ? 'sedang' : 'cepat'); }
  function persen(a, b) { b = Number(b) || 0; return b ? ((Number(a) || 0) / b * 100).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + '%' : '0%'; }
  function tglWib(geser) { return new Date(Date.now() + 7 * 3600000 + (geser || 0) * 86400000).toISOString().slice(0, 10); }

  function ambilToken() {
    try { var u = JSON.parse(localStorage.getItem('trg_user') || 'null'); if (u && u.sessionToken) return u; } catch (e) { }
    return null;
  }
  async function panggil(body, batasMs) {
    var ctl = new AbortController(), t = setTimeout(function () { ctl.abort(); }, batasMs || 60000);
    try {
      var r = await fetch(URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ sessionToken: S.token }, body)), signal: ctl.signal });
      var j = await r.json();
      if (j && j._sesiBaru) { try { var u = ambilToken(); if (u) { u.sessionToken = j._sesiBaru; localStorage.setItem('trg_user', JSON.stringify(u)); S.token = j._sesiBaru; } } catch (e) { } }
      return j;
    } finally { clearTimeout(t); }
  }

  function layarPesan(judul, teks) {
    el('isi').innerHTML = '<div class="layar-pesan"><div class="kartu"><h2 style="margin-bottom:8px">' + esc(judul) + '</h2><p>' + teks + '</p><a class="tombol utama" href="./">Buka OmniAI</a></div></div>';
  }

  /* ---------------- Kerangka halaman ---------------- */
  function kerangka() {
    el('isi').innerHTML =
      '<div class="filter">' +
        ['1:Hari ini', '7:7 hari', '30:30 hari', '90:90 hari', '180:180 hari'].map(function (x) { var p = x.split(':'); return '<button class="chip" data-preset="' + p[0] + '">' + p[1] + '</button>'; }).join('') +
        '<input type="date" id="f-dari" aria-label="Dari tanggal"> <span style="color:var(--redup)">s/d</span> <input type="date" id="f-sampai" aria-label="Sampai tanggal">' +
        '<button class="tombol" id="f-muat">↻ Muat ulang</button><span class="status" id="f-status"></span>' +
      '</div>' +
      '<div class="kpi" id="kpi"></div>' +
      '<div class="sorotan" id="sorotan"></div>' +
      '<div class="grid2"><div class="kartu grafik"><h3>📈 Aktivitas per hari</h3><div id="g-hari"></div></div>' +
      '<div class="kartu"><h3>🕒 Jam sibuk <small>jumlah catatan per jam (WIB)</small></h3><div id="g-jam"></div></div></div>' +
      '<div class="grid2"><div class="kartu"><h3>🐢 Aksi paling lambat <small>median / 95% terlama</small></h3><div class="gulir" id="t-lambat"></div></div>' +
      '<div class="kartu"><h3>⏱️ Waktu muat halaman</h3><div class="gulir" id="t-muat"></div></div></div>' +
      '<div class="grid2"><div class="kartu"><h3>🧭 Menu paling sering dipakai</h3><div class="gulir" id="t-menu"></div></div>' +
      '<div class="kartu"><h3>⚠️ Error terbanyak</h3><div class="gulir" id="t-error"></div></div></div>' +
      '<div class="kartu" style="margin-bottom:14px"><h3>👥 Pengguna</h3><div class="gulir" id="t-pengguna"></div></div>' +
      '<div class="grid2"><div class="kartu"><h3>🔁 Aksi paling sering</h3><div class="gulir" id="t-sering"></div></div>' +
      '<div class="kartu"><h3>📦 Scan resi & ukuran khusus</h3><div class="gulir" id="t-ukur"></div></div></div>' +
      '<div class="grid2"><div class="kartu"><h3>🖱️ Tombol paling sering diklik</h3><div class="gulir" id="t-klik"></div></div>' +
      '<div class="kartu"><h3>🔎 Pencarian populer</h3><div class="gulir" id="t-cari"></div></div></div>' +
      '<div class="grid2"><div class="kartu"><h3>📝 Form ditinggal di tengah jalan</h3><div class="gulir" id="t-form"></div></div>' +
      '<div class="kartu"><h3>🧊 Aplikasi macet (layar membeku ≥ 0,2 dtk)</h3><div class="gulir" id="t-macet"></div></div></div>' +
      '<div class="grid2"><div class="kartu"><h3>⬇️ Unduh data untuk dianalisa Claude</h3>' +
        '<p style="color:var(--redup);margin:0 0 10px;font-size:13px">Sesuai rentang tanggal di atas. Paket AI berisi ringkasan + prompt siap pakai; data mentah untuk analisa mendalam.</p>' +
        '<div class="unduh">' +
          '<button class="tombol utama" data-unduh="paket">🤖 Paket Analisa AI (.md)</button>' +
          '<button class="tombol" data-unduh="ringkasan-json">Ringkasan JSON</button><button class="tombol" data-unduh="ringkasan-csv">Ringkasan CSV</button>' +
          '<button class="tombol" data-unduh="mentah-json">Mentah JSON</button><button class="tombol" data-unduh="mentah-csv">Mentah CSV</button>' +
        '</div><div id="unduh-status" style="color:var(--redup);font-size:12.5px;margin-top:8px"></div></div>' +
      '<div class="kartu"><h3>💾 Penyimpanan Supabase (paket Free)</h3><div id="simpan"></div></div></div>';
    document.querySelectorAll('[data-preset]').forEach(function (b) { b.onclick = function () { setPreset(b.dataset.preset); muat(); }; });
    el('f-dari').onchange = el('f-sampai').onchange = function () { S.preset = ''; S.dari = el('f-dari').value; S.sampai = el('f-sampai').value; tandaiPreset(); muat(); };
    el('f-muat').onclick = function () { muat(); };
    document.querySelectorAll('[data-unduh]').forEach(function (b) { b.onclick = function () { unduh(b.dataset.unduh, b); }; });
  }
  function setPreset(p) { S.preset = p; var n = Number(p) || 7; S.sampai = tglWib(0); S.dari = tglWib(-(n - 1)); tandaiPreset(); }
  function tandaiPreset() {
    document.querySelectorAll('[data-preset]').forEach(function (b) { b.classList.toggle('aktif', b.dataset.preset === S.preset); });
    el('f-dari').value = S.dari; el('f-sampai').value = S.sampai;
  }

  /* ---------------- Muat ringkasan ---------------- */
  var KUNCI_CACHE = 'omx_statistik_cache_v1';
  async function muat() {
    if (S.sibuk) return;
    S.sibuk = true;
    el('f-status').textContent = 'Memperbarui…';
    // tampil instan dari cache lokal (rentang yang sama), lalu diperbarui diam-diam
    try { var c = JSON.parse(localStorage.getItem(KUNCI_CACHE) || 'null'); if (c && c.dari === S.dari && c.sampai === S.sampai && !S.data) { S.data = c; render(); } } catch (e) { }
    var t0 = performance.now();
    try {
      var d = await panggil({ aksi: 'analitik_ringkasan', dari: S.dari, sampai: S.sampai }, 90000);
      if (!d || !d.success) {
        if (/khusus Owner/i.test((d && d.error) || '')) { layarPesan('Khusus Owner', esc(d.error)); return; }
        throw new Error((d && d.error) || 'Gagal memuat');
      }
      S.data = d; S.owner = d.owner;
      try { localStorage.setItem(KUNCI_CACHE, JSON.stringify(d)); } catch (e) { }
      if (d.owner && d.owner.nama) el('nama-owner').textContent = d.owner.nama;
      render();
      el('f-status').textContent = 'Diperbarui ' + new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' · ' + ms(performance.now() - t0);
    } catch (e) {
      el('f-status').textContent = '⚠ ' + (e.name === 'AbortError' ? 'Server lama menjawab, coba lagi' : e.message);
    } finally { S.sibuk = false; }
  }

  /* ---------------- Render ---------------- */
  function tabel(id, kolom, baris, kosong) {
    var w = el(id); if (!w) return;
    if (!baris || !baris.length) { w.innerHTML = '<div class="kosong">' + (kosong || 'Belum ada data di rentang ini.') + '</div>'; return; }
    w.innerHTML = '<table><thead><tr>' + kolom.map(function (k) { return '<th class="' + (k.n ? 'n' : '') + '">' + esc(k.j) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      baris.map(function (r) { return '<tr>' + kolom.map(function (k) { return '<td class="' + (k.n ? 'n' : '') + '">' + k.f(r) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>';
  }
  function namaHalaman(n) {
    var j = S.data && S.data.judul && S.data.judul[n];
    return (j ? '<b>' + esc(j) + '</b><span class="sub">' + esc(n) + '</span>' : esc(n));
  }
  function render() {
    var d = S.data; if (!d) return;
    var k = d.kartu || {};
    var aksi = Number(k.aksi) || 0, gagal = Number(k.aksi_gagal) || 0;
    el('kpi').innerHTML = [
      ['Pengguna aktif', angka(k.pengguna_aktif), angka(k.sesi) + ' sesi'],
      ['Waktu aktif', ms((Number(k.menit_aktif) || 0) * 60000), 'total semua pengguna'],
      ['Aksi ke server', angka(aksi), angka(k.peristiwa) + ' catatan total'],
      ['Aksi gagal', persen(gagal, aksi), angka(gagal) + ' kali'],
      ['Median waktu aksi', ms(k.aksi_p50_ms), 'semua aksi'],
      ['Error aplikasi', angka(k.error_js), 'error JavaScript']
    ].map(function (x) { return '<div class="kartu"><div class="label">' + x[0] + '</div><div class="angka">' + x[1] + '</div><div class="ket">' + x[2] + '</div></div>'; }).join('');
    renderSorotan(d);
    renderHari(d.perHari || []);
    renderJam(d.jam || []);
    var kolLambat = [
      { j: 'Aksi', f: function (r) { return esc(r.nama); } },
      { j: 'Jumlah', n: 1, f: function (r) { return angka(r.jumlah) + (r.gagal ? '<span class="sub" style="color:var(--merah)">' + angka(r.gagal) + ' gagal</span>' : ''); } },
      { j: 'Median', n: 1, f: function (r) { return '<span class="' + kelasCepat(r.p50_ms) + '">' + ms(r.p50_ms) + '</span>'; } },
      { j: '95%', n: 1, f: function (r) { return ms(r.p95_ms); } },
      { j: 'Server / jaringan', f: function (r) {
          var sv = Number(r.server_p50_ms) || 0, jr = Number(r.jaringan_p50_ms) || 0, t = sv + jr || 1;
          return '<span class="sub">' + ms(r.server_p50_ms) + ' / ' + ms(r.jaringan_p50_ms) + '</span><div class="bar"><i class="sv" style="width:' + (sv / t * 100) + '%"></i><i class="jr" style="width:' + (jr / t * 100) + '%"></i></div>'; } }
    ];
    tabel('t-lambat', kolLambat, (d.aksiLambat || []).slice(0, 15));
    tabel('t-sering', kolLambat, (d.aksiSering || []).slice(0, 15));
    tabel('t-muat', [
      { j: 'Halaman', f: function (r) { return namaHalaman(r.nama); } },
      { j: 'Dibuka', n: 1, f: function (r) { return angka(r.jumlah); } },
      { j: 'Median', n: 1, f: function (r) { return '<span class="' + kelasCepat(r.p50_ms, 800, 2500) + '">' + ms(r.p50_ms) + '</span>'; } },
      { j: '95%', n: 1, f: function (r) { return ms(r.p95_ms); } }
    ], (d.muat || []).slice(0, 15));
    tabel('t-menu', [
      { j: 'Halaman / menu', f: function (r) { return namaHalaman(r.nama); } },
      { j: 'Kunjungan', n: 1, f: function (r) { return angka(r.jumlah); } },
      { j: 'Rata lama dipakai', n: 1, f: function (r) { return ms(r.rata_ms); } }
    ], (d.menu || []).slice(0, 15));
    tabel('t-error', [
      { j: 'Jenis', f: function (r) { return '<span class="tag">' + esc({ aksi: 'aksi gagal', error_js: 'error JS', pesan_error: 'pesan ke staff', form_batal: 'form ditinggal', klik_marah: 'klik berulang' }[r.jenis] || r.jenis) + '</span>'; } },
      { j: 'Di mana / pesan', f: function (r) { return esc(r.nama) + '<span class="sub">' + esc(r.pesan) + '</span>'; } },
      { j: 'Jumlah', n: 1, f: function (r) { return angka(r.jumlah); } }
    ], (d.error || []).filter(function (r) { return r.jenis !== 'form_batal'; }).slice(0, 15), 'Tidak ada error di rentang ini 🎉');
    tabel('t-pengguna', [
      { j: 'Pengguna', f: function (r) { return r.email ? '<b>' + esc(r.nama || r.email) + '</b><span class="sub">' + esc(r.email) + '</span>' : '<span class="sub">(belum login)</span>'; } },
      { j: 'Role', f: function (r) { return esc(r.role || '-') + '<span class="sub">' + esc(r.perangkat || '') + '</span>'; } },
      { j: 'Hari aktif', n: 1, f: function (r) { return angka(r.hari_aktif); } },
      { j: 'Waktu aktif', n: 1, f: function (r) { return ms((r.menit_aktif || 0) * 60000); } },
      { j: 'Halaman', n: 1, f: function (r) { return angka(r.halaman); } },
      { j: 'Aksi', n: 1, f: function (r) { return angka(r.aksi); } },
      { j: 'Gagal', n: 1, f: function (r) { return r.gagal ? '<span class="lambat">' + angka(r.gagal) + '</span>' : '0'; } },
      { j: 'Error JS', n: 1, f: function (r) { return angka(r.error_js); } }
    ], d.pengguna || []);
    tabel('t-ukur', [
      { j: 'Ukuran', f: function (r) { return esc({ scan_resi: 'Scan resi → hasil tampil', scan_dobel_ditolak: 'Scan dobel ditolak seketika' }[r.nama] || r.nama); } },
      { j: 'Jumlah', n: 1, f: function (r) { return angka(r.jumlah); } },
      { j: 'Median', n: 1, f: function (r) { return '<span class="' + kelasCepat(r.p50_ms) + '">' + ms(r.p50_ms) + '</span>'; } },
      { j: '95%', n: 1, f: function (r) { return ms(r.p95_ms); } }
    ], d.ukur || []);
    tabel('t-klik', [
      { j: 'Tombol', f: function (r) { return esc(r.nama); } },
      { j: 'Klik', n: 1, f: function (r) { return angka(r.jumlah); } }
    ], (d.klik || []).slice(0, 15));
    tabel('t-cari', [
      { j: 'Kata kunci', f: function (r) { return esc(r.nama); } },
      { j: 'Dicari', n: 1, f: function (r) { return angka(r.jumlah); } }
    ], (d.cari || []).slice(0, 15));
    tabel('t-form', [
      { j: 'Form', f: function (r) { return esc(r.nama); } },
      { j: 'Ditinggal', n: 1, f: function (r) { return angka(r.jumlah); } },
      { j: 'Rata sudah diisi', n: 1, f: function (r) { return ms(r.rata_ms); } }
    ], d.formBatal || [], 'Tidak ada form yang ditinggal 👍');
    tabel('t-macet', [
      { j: 'Halaman', f: function (r) { return namaHalaman(r.nama); } },
      { j: 'Kejadian', n: 1, f: function (r) { return angka(r.jumlah); } },
      { j: 'Terlama', n: 1, f: function (r) { return '<span class="' + kelasCepat(r.maks_ms, 300, 1000) + '">' + ms(r.maks_ms) + '</span>'; } }
    ], d.macet || [], 'Tidak ada layar membeku tercatat 👍');
    renderSimpan(d.penyimpanan || {});
  }
  function renderSorotan(d) {
    var s = [];
    var lambat = (d.aksiLambat || []).filter(function (r) { return r.jumlah >= 3 && r.p50_ms >= 2000; })[0];
    if (lambat) s.push(['bahaya', '🐢', 'Aksi terlambat: ' + lambat.nama, 'Median ' + ms(lambat.p50_ms) + ' (' + angka(lambat.jumlah) + ' kali). Server ' + ms(lambat.server_p50_ms) + ', jaringan ' + ms(lambat.jaringan_p50_ms) + '.']);
    var gagalTinggi = (d.aksiSering || []).filter(function (r) { return r.jumlah >= 5 && r.gagal / r.jumlah >= 0.1; }).sort(function (a, b) { return b.gagal / b.jumlah - a.gagal / a.jumlah; })[0];
    if (gagalTinggi) s.push(['bahaya', '⛔', 'Sering gagal: ' + gagalTinggi.nama, persen(gagalTinggi.gagal, gagalTinggi.jumlah) + ' dari ' + angka(gagalTinggi.jumlah) + ' percobaan gagal.']);
    var err = (d.error || [])[0];
    if (err) s.push(['waspada', '⚠️', 'Error terbanyak (' + angka(err.jumlah) + 'x)', esc(err.nama) + ' · ' + esc(err.pesan)]);
    var form = (d.formBatal || [])[0];
    if (form && form.jumlah >= 2) s.push(['waspada', '📝', 'Form sering ditinggal: ' + form.nama, angka(form.jumlah) + ' kali ditutup sebelum disimpan.']);
    var jamTop = (d.jam || []).slice().sort(function (a, b) { return b.peristiwa - a.peristiwa; })[0];
    if (jamTop) s.push(['', '🕒', 'Jam tersibuk: ' + String(jamTop.jam).padStart(2, '0') + '.00 WIB', angka(jamTop.peristiwa) + ' catatan · rata ' + jamTop.pengguna_rata + ' pengguna.']);
    var menuTop = (d.menu || [])[0];
    if (menuTop) s.push(['baik', '🧭', 'Paling sering dibuka: ' + ((d.judul && d.judul[menuTop.nama]) || menuTop.nama), angka(menuTop.jumlah) + ' kunjungan, rata ' + ms(menuTop.rata_ms) + '.']);
    el('sorotan').innerHTML = s.map(function (x) { return '<div class="sorot ' + x[0] + '"><div class="ikon">' + x[1] + '</div><div><b>' + esc(x[2]) + '</b><span>' + x[3] + '</span></div></div>'; }).join('');
  }
  function renderHari(rows) {
    var w = el('g-hari');
    if (!rows.length) { w.innerHTML = '<div class="kosong">Belum ada data.</div>'; return; }
    var W = 640, H = 190, pad = 26, n = rows.length, bw = Math.max(2, (W - pad * 2) / n * 0.62);
    var maks = Math.max.apply(null, rows.map(function (r) { return Number(r.aksi) || 0; }).concat([1]));
    var maksP = Math.max.apply(null, rows.map(function (r) { return Number(r.pengguna) || 0; }).concat([1]));
    var x = function (i) { return pad + (i + 0.5) * (W - pad * 2) / n; };
    var bar = rows.map(function (r, i) {
      var h = (Number(r.aksi) || 0) / maks * (H - 50), hg = (Number(r.gagal) || 0) / maks * (H - 50);
      return '<g><title>' + r.tanggal + ': ' + angka(r.aksi) + ' aksi, ' + angka(r.gagal) + ' gagal, ' + angka(r.pengguna) + ' pengguna</title>' +
        '<rect x="' + (x(i) - bw / 2) + '" y="' + (H - 24 - h) + '" width="' + bw + '" height="' + h + '" rx="3" fill="var(--aksen)" opacity=".85"/>' +
        (hg ? '<rect x="' + (x(i) - bw / 2) + '" y="' + (H - 24 - hg) + '" width="' + bw + '" height="' + hg + '" rx="2" fill="var(--merah)"/>' : '') + '</g>';
    }).join('');
    var garis = rows.map(function (r, i) { return (i ? 'L' : 'M') + x(i) + ' ' + (H - 24 - (Number(r.pengguna) || 0) / maksP * (H - 50)); }).join(' ');
    var label = rows.map(function (r, i) { return (n <= 14 || i % Math.ceil(n / 10) === 0) ? '<text x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10" fill="var(--redup)">' + r.tanggal.slice(5).replace('-', '/') + '</text>' : ''; }).join('');
    w.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Grafik aktivitas per hari">' + bar +
      '<path d="' + garis + '" fill="none" stroke="var(--kuning)" stroke-width="2"/>' + label + '</svg>' +
      '<div class="legenda"><span><i style="background:var(--aksen)"></i>Aksi ke server</span><span><i style="background:var(--merah)"></i>Gagal</span><span><i style="background:var(--kuning)"></i>Pengguna</span></div>';
  }
  function renderJam(rows) {
    var w = el('g-jam'), peta = {};
    rows.forEach(function (r) { peta[r.jam] = r; });
    var maks = Math.max.apply(null, rows.map(function (r) { return r.peristiwa; }).concat([1]));
    var sel = '', lab = '';
    for (var j = 0; j < 24; j++) {
      var r = peta[j] || { peristiwa: 0, aksi: 0, pengguna_rata: 0 };
      sel += '<div title="' + String(j).padStart(2, '0') + '.00: ' + angka(r.peristiwa) + ' catatan, ' + angka(r.aksi) + ' aksi, rata ' + r.pengguna_rata + ' pengguna" style="opacity:' + (0.08 + 0.92 * r.peristiwa / maks).toFixed(2) + '"></div>';
      lab += '<span>' + (j % 3 === 0 ? j : '') + '</span>';
    }
    w.innerHTML = '<div class="jam">' + sel + '</div><div class="jam-label">' + lab + '</div><div class="legenda"><span>Makin pekat = makin sibuk. Arahkan kursor/tap kotak untuk angka.</span></div>';
  }
  function renderSimpan(p) {
    var db = (Number(p.db_byte) || 0) / 1048576, an = (Number(p.analitik_byte) || 0) / 1048576;
    var baris = Number(p.baris_mentah) || 0, maks = Number(p.maks_baris_mentah) || 400000;
    el('simpan').innerHTML =
      '<div style="font-size:13px">Database total <b>' + db.toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' MB</b> dari ' + BATAS_DB_MB + ' MB</div>' +
      '<div class="meter"><i style="width:' + Math.min(100, db / BATAS_DB_MB * 100) + '%;' + (db > BATAS_DB_MB * 0.8 ? 'background:var(--merah)' : '') + '"></i></div>' +
      '<div style="color:var(--redup);font-size:12.5px">Statistik memakai ' + an.toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' MB · ' + angka(baris) + ' / ' + angka(maks) + ' baris mentah' +
      (p.mentah_sejak ? ' · sejak ' + new Date(p.mentah_sejak).toLocaleDateString('id-ID') : '') + '</div>' +
      '<div style="color:var(--redup);font-size:12.5px;margin-top:6px">Data mentah disimpan ' + esc(p.hari_simpan || 180) + ' hari (atau lebih pendek otomatis bila melewati batas baris). Ringkasan harian disimpan selamanya.</div>';
  }

  /* ---------------- Unduh ---------------- */
  function simpanFile(nama, isi, tipe) {
    var blob = new Blob([isi], { type: tipe });
    var a = document.createElement('a');
    a.href = URL_.createObjectURL(blob); a.download = nama;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL_.revokeObjectURL(a.href); }, 4000);
  }
  var URL_ = window.URL;
  function csv(baris, kolom) {
    var q = function (v) {
      if (v === null || v === undefined) return '';
      if (typeof v === 'object') v = JSON.stringify(v);
      v = String(v);
      return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    };
    return '\ufeff' + kolom.join(',') + '\n' + baris.map(function (r) { return kolom.map(function (k) { return q(r[k]); }).join(','); }).join('\n');
  }
  function namaFile(jenis, ext) { return 'omniai-statistik-' + jenis + '_' + S.dari + '_sd_' + S.sampai + '.' + ext; }
  async function ambilMentah(status) {
    var semua = [], sesi = {}, setelah = null, putaran = 0;
    do {
      var r = await panggil({ aksi: 'analitik_unduh', jenis: 'mentah', dari: S.dari, sampai: S.sampai, batas: 5000, setelah: setelah }, 120000);
      if (!r || !r.success) throw new Error((r && r.error) || 'Gagal mengunduh');
      semua = semua.concat(r.peristiwa); (r.sesi || []).forEach(function (s) { sesi[s.id] = s; });
      setelah = r.berikut;
      status('Mengambil data mentah… ' + angka(semua.length) + ' baris');
    } while (setelah && ++putaran < 60);
    return { peristiwa: semua, sesi: Object.values(sesi), terpotong: !!setelah };
  }
  async function unduh(jenis, tombol) {
    var st = el('unduh-status');
    var status = function (t) { st.textContent = t; };
    tombol.disabled = true;
    try {
      if (jenis === 'mentah-json' || jenis === 'mentah-csv') {
        var m = await ambilMentah(status);
        if (jenis === 'mentah-json') {
          simpanFile(namaFile('mentah', 'json'), JSON.stringify({ format: 'omniai-analitik-mentah-v1', dari: S.dari, sampai: S.sampai, diunduh: new Date().toISOString(), terpotong: m.terpotong, sesi: m.sesi, peristiwa: m.peristiwa }, null, 1), 'application/json');
        } else {
          var peta = {}; m.sesi.forEach(function (s) { peta[s.id] = s; });
          var rows = m.peristiwa.map(function (p) {
            var s = peta[p.sesi] || {};
            return Object.assign({}, p, { nama_pengguna: s.nama, role: s.role, tampilan: s.tampilan, jenis_perangkat: s.jenis_perangkat, os: s.os, browser: s.browser, layar: s.layar, versi: s.versi });
          });
          simpanFile(namaFile('mentah', 'csv'), csv(rows, ['waktu_wib', 'id', 'sesi', 'email', 'nama_pengguna', 'role', 'jenis', 'nama', 'lokasi', 'durasi_ms', 'server_ms', 'jaringan_ms', 'berhasil', 'pesan', 'koneksi', 'data', 'tampilan', 'jenis_perangkat', 'os', 'browser', 'layar', 'versi']), 'text/csv;charset=utf-8');
        }
        status('✓ ' + angka(m.peristiwa.length) + ' baris diunduh' + (m.terpotong ? ' (terpotong di 300.000 baris - perkecil rentang tanggal)' : '') + '.');
      } else {
        status('Mengambil ringkasan…');
        var r = await panggil({ aksi: 'analitik_unduh', jenis: 'ringkasan', dari: S.dari, sampai: S.sampai }, 120000);
        if (!r || !r.success) throw new Error((r && r.error) || 'Gagal mengunduh');
        if (jenis === 'ringkasan-json') {
          simpanFile(namaFile('ringkasan', 'json'), JSON.stringify(Object.assign({ format: 'omniai-analitik-ringkasan-v1', diunduh: new Date().toISOString() }, r), null, 1), 'application/json');
        } else if (jenis === 'ringkasan-csv') {
          var gabung = [];
          r.harian.forEach(function (x) { gabung.push(Object.assign({ tabel: 'harian' }, x)); });
          r.pengguna.forEach(function (x) { gabung.push(Object.assign({ tabel: 'pengguna' }, x)); });
          r.jam.forEach(function (x) { gabung.push(Object.assign({ tabel: 'jam' }, x)); });
          r.error.forEach(function (x) { gabung.push(Object.assign({ tabel: 'error' }, x)); });
          simpanFile(namaFile('ringkasan', 'csv'), csv(gabung, ['tabel', 'tanggal', 'jam', 'jenis', 'nama', 'pesan', 'email', 'role', 'perangkat', 'jumlah', 'gagal', 'pengguna', 'rata_ms', 'p50_ms', 'p95_ms', 'maks_ms', 'server_p50_ms', 'jaringan_p50_ms', 'sesi', 'peristiwa', 'aksi', 'error_js', 'halaman', 'menit_aktif']), 'text/csv;charset=utf-8');
        } else {
          simpanFile(namaFile('paket-analisa-ai', 'md'), paketAi(r), 'text/markdown;charset=utf-8');
        }
        status('✓ File diunduh.');
      }
    } catch (e) { status('⚠ ' + e.message); }
    finally { tombol.disabled = false; }
  }
  function paketAi(r) {
    var d = S.data || {};
    var ringkas = {
      rentang: { dari: S.dari, sampai: S.sampai }, kartu: d.kartu, judul_halaman: d.judul,
      menu: d.menu, aksi_lambat: d.aksiLambat, aksi_sering: d.aksiSering, muat_halaman: d.muat, error: d.error, jam: d.jam,
      pengguna: d.pengguna, klik: d.klik, cari: d.cari, filter: d.filter, form_batal: d.formBatal, macet: d.macet, ukur: d.ukur,
      per_hari: d.perHari, ringkasan_harian_lengkap: r.harian
    };
    return '# Paket Analisa UX - OmniAI ERP (Waterground Coffee)\n\n' +
      'Rentang: **' + S.dari + ' s/d ' + S.sampai + '** (WIB) · diunduh ' + new Date().toLocaleString('id-ID') + '\n\n' +
      '## Prompt untuk Claude\n\n' +
      'Kamu adalah analis UX & product manager senior untuk ERP internal OmniAI (Waterground Coffee): aplikasi web satu-halaman untuk staff gudang (scan resi via HP), admin penjualan, keuangan, dan Owner. Backend Supabase Edge Function, frontend GitHub Pages. Arah produk: workflow serba-instan dan menuju Full AI Automation.\n\n' +
      'Data di bawah adalah ringkasan statistik pemakaian nyata. Arti kolom: `jumlah` = banyak kejadian, `p50_ms` = median durasi, `p95_ms` = 95% kejadian lebih cepat dari ini, `server_p50_ms` vs `jaringan_p50_ms` = pemisahan waktu proses server dan waktu internet, `gagal` = aksi yang gagal, jenis `muat` = waktu dari klik menu sampai semua data halaman tiba (0 = instan dari cache), `form_batal` = form yang diisi lalu ditutup tanpa disimpan, `macet` = layar membeku ≥200 ms, `klik_marah` = tombol diklik 3x+ dalam 1 detik.\n\n' +
      'Tolong:\n' +
      '1. Ringkas kesehatan aplikasi dalam 5 kalimat (angka utama + tren).\n' +
      '2. Daftar 10 MASALAH UX terbesar, urut dampak (frekuensi × keparahan). Untuk tiap masalah: bukti angka dari data, siapa yang terdampak (role/perangkat), dugaan penyebab (server lambat / jaringan / desain layar / error), dan tingkat keyakinanmu.\n' +
      '3. Kebiasaan pengguna: menu & jam paling sibuk, alur yang sering diulang, fitur yang jarang dipakai, perbedaan HP vs laptop dan antar role.\n' +
      '4. Usulan perbaikan BERPRIORITAS (tabel: prioritas P1/P2/P3, perbaikan, dampak yang diharapkan dalam angka, perkiraan usaha kecil/sedang/besar, metrik untuk membuktikan berhasil).\n' +
      '5. Peluang otomatisasi AI: pekerjaan berulang yang bisa dikerjakan otomatis oleh AI/jadwal tanpa klik manusia.\n' +
      '6. Data tambahan apa yang perlu direkam supaya analisa berikutnya lebih tajam.\n' +
      'Jangan mengarang angka yang tidak ada di data; tandai dugaan sebagai dugaan. Jawab dalam Bahasa Indonesia.\n\n' +
      '## Data ringkasan (JSON)\n\n```json\n' + JSON.stringify(ringkas, null, 1) + '\n```\n';
  }

  /* ---------------- Mulai ---------------- */
  var u = ambilToken();
  if (!u) { layarPesan('Belum login', 'Buka OmniAI dan login sebagai <b>Owner</b> di browser ini, lalu buka lagi halaman ini dari menu profil → <b>Statistik Pengguna</b>.'); return; }
  S.token = u.sessionToken;
  if (u.nama) el('nama-owner').textContent = u.nama;
  if (!u.isOwner) { layarPesan('Khusus Owner', 'Akun <b>' + esc(u.email || '') + '</b> bukan Owner. Halaman ini hanya bisa dibuka Owner.'); return; }
  kerangka();
  setPreset('7');
  muat();
})();
</script>
</body>
</html>
